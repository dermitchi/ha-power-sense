import_history:
  fields:
    device:
      required: false
      example: "Living room lamps"
      selector:
        text:
    days:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 730
          mode: box
          unit_of_measurement: days
    since:
      required: false
      selector:
        date:
    fill_watts:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
          unit_of_measurement: W
